services:
  z-media-workflow:
    image: jiuwusan/z-media-workflow:latest
    container_name: z-media-workflow
    ports:
      - '3000:3000'
    volumes:
      - workflow-data:/app/data
    restart: always
    stop_grace_period: 45s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    networks:
      - wk

networks:
  wk:
    external: true

volumes:
  workflow-data:
